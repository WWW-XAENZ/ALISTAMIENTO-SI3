<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN - TRAZABILIDAD</title>
  <link rel="icon" type="image/png" href="Logo-Web-SI3.png">
  <link rel="stylesheet" href="Estilo.css">
  <style>
    .admin-page {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .admin-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .admin-empty {
      text-align: center;
      color: var(--text-tertiary);
      padding: 60px 20px;
      font-size: 1rem;
    }
    .admin-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .admin-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-2xl);
    }
    .admin-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-secondary);
    }
    .admin-card-title {
      font-weight: 700;
      font-size: 0.9375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }
    .admin-card-meta {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .admin-card-body {
      padding: 16px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
    }
    .admin-card-img {
      width: 100%;
      height: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: var(--radius-lg);
      cursor: pointer;
      background: #ffffff;
    }
    .admin-card-empty {
      color: var(--text-tertiary);
      font-size: 0.875rem;
    }
    .btn-back {
      padding: 10px 18px;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border-default);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      background: var(--gray-50);
      border-color: var(--border-dark);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="admin-page">
    <div class="admin-header">
      <h1>ADMIN - TRAZABILIDAD</h1>
      <button class="btn-back" onclick="window.close()">CERRAR</button>
    </div>
    <div class="admin-toolbar">
      <div class="admin-search">
        <label for="adminSearch">BUSCAR</label>
        <input type="text" id="adminSearch" placeholder="Referencia, responsable, CKD...">
      </div>
      <div class="admin-date">
        <label for="adminDate">FECHA</label>
        <input type="date" id="adminDate">
        <button type="button" class="btn-today" id="btnHoy">HOY</button>
      </div>
      <button class="btn-clear-filters" id="btnClearFilters">LIMPIAR FILTROS</button>
    </div>
    <div id="adminGrid" class="admin-grid"></div>
  </div>

  <style>
    .admin-toolbar {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .admin-search,
    .admin-date {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-search label,
    .admin-date label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .admin-search input,
    .admin-date input {
      padding: 10px 14px;
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg);
      font-size: 0.9375rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 44px;
      box-shadow: var(--shadow-xs);
    }
    .btn-clear-filters {
      padding: 10px 16px;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border-default);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-height: 44px;
      transition: all 0.2s ease;
    }
    .btn-clear-filters:hover {
      background: var(--gray-50);
      border-color: var(--border-dark);
      color: var(--text-primary);
    }
    .btn-today {
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--primary-200);
      background: var(--primary-50);
      color: var(--primary-700);
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-height: 36px;
      transition: all 0.2s ease;
    }
    .btn-today:hover {
      background: var(--primary-100);
      border-color: var(--primary-300);
    }
    @media (max-width: 640px) {
      .admin-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .admin-search input,
      .admin-date input {
        width: 100%;
      }
      .btn-clear-filters {
        width: 100%;
      }
    }
  </style>

  <script src="admin.js"></script>
</body>
</html>
