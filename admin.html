<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administración de trazabilidad de alistamiento.">
    <title>Admin - Alistamiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <img src="Logo-Web-SI3.png" alt="Logo SI3" class="logo-img" width="48" height="48">
            <div class="logo-text">
                <div class="logo-title">TRAZABILIDAD</div>
                <div class="logo-subtitle">Panel de Trazabilidad</div>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="hamburger" id="btnMenu" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>

    <!-- MENU OVERLAY -->
    <nav class="menu-overlay" id="menuOverlay">
        <div class="menu-panel">
            <button type="button" class="menu-close" id="btnCerrarMenu" aria-label="Cerrar menú">✕</button>
            <h3 class="menu-title">MENÚ</h3>
            <ul class="menu-list">
                <li><a href="Alistamiento.html" id="menuInicio" class="menu-link">VOLVER A INICIO</a></li>
            </ul>
        </div>
    </nav>

    <!-- ADMIN -->
    <section class="admin" id="seccionAdmin">
        <div class="container">
            <h2>REPORTADOS</h2>
            <div class="admin-filters">
                <div class="calendar-input-wrap">
                    <input type="text" id="adminDate" readonly placeholder="Filtrar fecha">
                    <span class="calendar-icon" data-for="adminDate">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V4"/><path d="M16 8V4"/><path d="M3 12h18"/></svg>
                    </span>
                </div>
                <input type="text" id="adminSearch" class="admin-filter-input" placeholder="Buscar referencia o responsable...">
                <button type="button" class="btn btn-outline" id="btnHoy">Hoy</button>
                <button type="button" class="btn btn-secondary" id="btnClearFilters">Limpiar filtros</button>
            </div>
            <div id="adminGrid" class="admin-grid"></div>
            <div class="form-actions">
                <a href="Alistamiento.html" class="btn btn-secondary" id="btnVolverInicioAdmin">VOLVER</a>
            </div>
        </div>
    </section>

    <div id="calendarDropdown" class="calendar-dropdown"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="admin.js"></script>
    <script src="calendario.js"></script>
</body>
</html>
