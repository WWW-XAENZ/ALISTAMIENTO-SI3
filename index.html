<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALISTAMIENTO - INICIO</title>
  <link rel="icon" type="image/png" href="Logo-Web-SI3.png">
  <link rel="stylesheet" href="Estilo.css">
  <style>
    .landing {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .landing-grid {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .landing-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-2xl);
      padding: 48px 32px;
      box-shadow: var(--shadow-2xl);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: inherit;
    }
    .landing-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-2xl), 0 0 0 2px var(--primary-300);
      border-color: var(--primary-400);
    }
    .landing-icon {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-xl);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .landing-title {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }
    .landing-subtitle {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .landing-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .landing-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg);
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      text-align: center;
      letter-spacing: 0.08em;
    }
    .landing-input::placeholder {
      text-transform: uppercase;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
    }
    .landing-btn {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
      color: var(--text-inverse);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.9375rem;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }
    .landing-btn:hover {
      background: linear-gradient(135deg, var(--primary-700) 0%, var(--primary-800) 100%);
    }
    .landing-error {
      font-size: 0.875rem;
      color: #dc2626;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-height: 20px;
    }
    @media (max-width: 640px) {
      .landing-grid {
        grid-template-columns: 1fr;
      }
      .landing-card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-grid">
      <div class="landing-card">
        <div class="landing-icon">A</div>
        <div class="landing-title">Alistamiento</div>
        <div class="landing-subtitle">Sistema de registro principal</div>
        <form class="landing-form" data-module="alistamiento">
          <input type="password" class="landing-input" placeholder="CONTRASENA" autocomplete="off" required>
          <div class="landing-error"></div>
          <button type="submit" class="landing-btn">INGRESAR</button>
        </form>
      </div>
      <div class="landing-card">
        <div class="landing-icon">AD</div>
        <div class="landing-title">Admin</div>
        <div class="landing-subtitle">Panel de trazabilidad y fotos</div>
        <form class="landing-form" data-module="admin">
          <input type="password" class="landing-input" placeholder="CONTRASENA" autocomplete="off" required>
          <div class="landing-error"></div>
          <button type="submit" class="landing-btn">INGRESAR</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const expectedPasswords = {
      alistamiento: 'ALISTAMIENTOCEDI2',
      admin: 'TRAZABILIDADCEDI2'
    };

    const redirects = {
      alistamiento: 'Alistamiento.html',
      admin: 'admin.html'
    };

    document.querySelectorAll('.landing-form').forEach(form => {
      const module = form.getAttribute('data-module');
      const input = form.querySelector('.landing-input');
      const error = form.querySelector('.landing-error');
      const btn = form.querySelector('.landing-btn');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const password = input.value.trim();
        const expected = expectedPasswords[module];

        if (!password) {
          error.textContent = 'Ingresa la contrasena';
          return;
        }
        if (password !== expected) {
          error.textContent = 'Contrasena incorrecta';
          return;
        }

        error.textContent = '';
        btn.disabled = true;
        btn.textContent = 'INGRESANDO...';
        setTimeout(() => {
          window.location.href = redirects[module];
        }, 200);
      });
    });
  </script>
</body>
</html>
