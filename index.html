<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALISTAMIENTO - INICIO</title>
  <link rel="icon" type="image/png" href="Logo-Web-SI3.png">
  <link rel="stylesheet" href="Estilo.css">
  <style>
    .landing {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 55%, #eff6ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .landing-grid {
      width: 100%;
      max-width: 620px;
      position: relative;
      perspective: 1400px;
      padding: 28px 0 10px;
    }
    .landing-track {
      width: 100%;
      min-height: 500px;
      position: relative;
      transform: translateX(0);
      transform-style: preserve-3d;
    }
    .landing-card {
      position: absolute;
      inset: 0;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 24px;
      padding: 42px 34px;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.1), 0 3px 8px rgba(15, 23, 42, 0.06);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      opacity: 0.45;
      transform: translateX(0) translateZ(-80px) rotateY(0deg) scale(0.9);
      transform-origin: center center;
      backface-visibility: hidden;
      transition: opacity 0.7s ease, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
      will-change: transform, opacity;
    }
    .landing-card.is-visible {
      opacity: 1;
      transform: translateX(0) translateZ(60px) rotateY(0deg) scale(1);
      z-index: 3;
      box-shadow: 0 28px 55px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(37, 99, 235, 0.12);
    }
    .landing-card.is-prev,
    .landing-card.is-next {
      opacity: 0.72;
      z-index: 2;
    }
    .landing-card.is-prev {
      transform: translateX(-18%) translateZ(-20px) rotateY(18deg) rotateZ(-3deg) scale(0.9);
    }
    .landing-card.is-next {
      transform: translateX(18%) translateZ(-20px) rotateY(-18deg) rotateZ(3deg) scale(0.9);
    }
    .landing-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }
    .carousel-arrow {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-full);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .carousel-arrow:hover {
      background: var(--primary-600);
      color: var(--text-inverse);
      transform: scale(1.08);
    }
    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .carousel-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: var(--radius-full);
      background: var(--border-default);
      cursor: pointer;
      transition: width 0.25s ease, background 0.25s ease;
    }
    .carousel-dot.active {
      width: 26px;
      background: var(--primary-600);
    }
    .landing-card:hover {
      box-shadow: var(--shadow-2xl), 0 0 0 2px var(--primary-300);
      border-color: var(--primary-400);
    }
    .landing-card.is-visible:hover {
      transform: translateX(0) translateZ(60px) rotateY(0deg) scale(1.01) translateY(-6px);
    }
    .landing-card.is-prev:hover {
      transform: translateX(-18%) translateZ(-20px) rotateY(18deg) rotateZ(-3deg) scale(0.9) translateY(-4px);
    }
    .landing-card.is-next:hover {
      transform: translateX(18%) translateZ(-20px) rotateY(-18deg) rotateZ(3deg) scale(0.9) translateY(-4px);
    }
    .landing-icon {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-xl);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .landing-title {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }
    .landing-subtitle {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .landing-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .landing-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg);
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      text-align: center;
      letter-spacing: 0.08em;
    }
    .landing-input::placeholder {
      text-transform: uppercase;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
    }
    .landing-btn {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
      color: var(--text-inverse);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.9375rem;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }
    .landing-btn:hover {
      background: linear-gradient(135deg, var(--primary-700) 0%, var(--primary-800) 100%);
    }
    .landing-error {
      font-size: 0.875rem;
      color: #dc2626;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-height: 20px;
    }
    @media (max-width: 900px) {
      .landing-grid {
        max-width: min(520px, 100%);
      }
      .landing-card {
        padding: 36px 24px;
      }
      .landing-title {
        font-size: 1.3rem;
      }
      .landing-card.is-prev {
        transform: translateX(-12%) translateZ(-20px) rotateY(14deg) rotateZ(-2deg) scale(0.92);
      }
      .landing-card.is-next {
        transform: translateX(12%) translateZ(-20px) rotateY(-14deg) rotateZ(2deg) scale(0.92);
      }
      .landing-card.is-prev:hover {
        transform: translateX(-12%) translateZ(-20px) rotateY(14deg) rotateZ(-2deg) scale(0.92) translateY(-4px);
      }
      .landing-card.is-next:hover {
        transform: translateX(12%) translateZ(-20px) rotateY(-14deg) rotateZ(2deg) scale(0.92) translateY(-4px);
      }
    }
    @media (max-width: 600px) {
      .landing {
        padding: 16px 10px;
      }
      .landing-grid {
        padding-top: 12px;
      }
      .landing-track {
        min-height: 450px;
      }
      .landing-card {
        border-radius: 20px;
        padding: 30px 18px;
      }
      .landing-icon {
        width: 68px;
        height: 68px;
        font-size: 28px;
      }
      .landing-form {
        max-width: 290px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .landing-track,
      .landing-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-grid">
      <div class="landing-track">
        <div class="landing-card is-visible">
        <div class="landing-icon">A</div>
        <div class="landing-title">Alistamiento</div>
        <div class="landing-subtitle">Sistema de registro principal</div>
        <form class="landing-form" data-module="alistamiento">
          <input type="password" class="landing-input" placeholder="CONTRASENA" autocomplete="off" required>
          <div class="landing-error"></div>
          <button type="submit" class="landing-btn">INGRESAR</button>
        </form>
        </div>
        <div class="landing-card">
        <div class="landing-icon">AD</div>
        <div class="landing-title">Admin</div>
        <div class="landing-subtitle">Panel de trazabilidad y fotos</div>
        <form class="landing-form" data-module="admin">
          <input type="password" class="landing-input" placeholder="CONTRASENA" autocomplete="off" required>
          <div class="landing-error"></div>
          <button type="submit" class="landing-btn">INGRESAR</button>
        </form>
        </div>
        <div class="landing-card">
        <div class="landing-icon">NC</div>
        <div class="landing-title">No Conformes</div>
        <div class="landing-subtitle">Sistema de registro de no conformes</div>
        <form class="landing-form" data-module="NoConformes">
          <input type="password" class="landing-input" placeholder="CONTRASENA" autocomplete="off" required>
          <div class="landing-error"></div>
          <button type="submit" class="landing-btn">INGRESAR</button>
        </form>
        </div>
      </div>
      <div class="landing-controls" aria-label="Controles del carrusel">
        <button type="button" class="carousel-arrow" id="carousel-prev" aria-label="Tarjeta anterior">&#8592;</button>
        <div class="carousel-dots">
          <button type="button" class="carousel-dot active" data-slide="0" aria-label="Mostrar Alistamiento"></button>
          <button type="button" class="carousel-dot" data-slide="1" aria-label="Mostrar Admin"></button>
          <button type="button" class="carousel-dot" data-slide="2" aria-label="Mostrar No Conformes"></button>
        </div>
        <button type="button" class="carousel-arrow" id="carousel-next" aria-label="Siguiente tarjeta">&#8594;</button>
      </div>
    </div>
  </div>

  <script>
    const expectedPasswords = {
      alistamiento: 'ALISTAMIENTOCEDI2',
      admin: 'TRAZABILIDADCEDI2',
      NoConformes: 'MATEOPIROBO'
    };

    const redirects = {
      alistamiento: 'Alistamiento.html',
      admin: 'admin.html',
      NoConformes: 'NoConformes.html'
    };

    document.querySelectorAll('.landing-form').forEach(form => {
      const module = form.getAttribute('data-module');
      const input = form.querySelector('.landing-input');
      const error = form.querySelector('.landing-error');
      const btn = form.querySelector('.landing-btn');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const password = input.value.trim();
        const expected = expectedPasswords[module];

        if (!password) {
          error.textContent = 'Ingresa la contrasena';
          return;
        }
        if (password !== expected) {
          error.textContent = 'Contrasena incorrecta';
          return;
        }

        error.textContent = '';
        btn.disabled = true;
        btn.textContent = 'INGRESANDO...';
        setTimeout(() => {
          window.location.href = redirects[module];
        }, 200);
      });
    });

    const carouselCards = document.querySelectorAll('.landing-card');
    const carouselDots = document.querySelectorAll('.carousel-dot');
    let currentSlide = 0;

    function showSlide(slide) {
      currentSlide = (slide + 3) % 3;
      carouselCards.forEach((card, index) => {
        card.classList.toggle('is-visible', index === currentSlide);
        card.classList.toggle('is-prev', index === (currentSlide + 2) % 3);
        card.classList.toggle('is-next', index === (currentSlide + 1) % 3);
      });
      carouselDots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentSlide);
      });
    }

    document.querySelector('#carousel-prev').addEventListener('click', () => {
      showSlide(currentSlide - 1);
    });

    document.querySelector('#carousel-next').addEventListener('click', () => {
      showSlide(currentSlide + 1);
    });

    carouselDots.forEach(dot => {
      dot.addEventListener('click', () => {
        showSlide(Number(dot.dataset.slide));
      });
    });

    showSlide(0);
  </script>
</body>
</html>
